plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// v1.4.2 优化：签名密码不再写进仓库，改从 local.properties（已 gitignore）或环境变量读取。
// 本机 local.properties 需包含：
//   ZEROLAB_STORE_PASSWORD=***
//   ZEROLAB_KEY_PASSWORD=***
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('local.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def zerolabStorePassword = keystoreProps.getProperty('ZEROLAB_STORE_PASSWORD')
        ?: System.getenv('ZEROLAB_STORE_PASSWORD') ?: ''
def zerolabKeyPassword = keystoreProps.getProperty('ZEROLAB_KEY_PASSWORD')
        ?: System.getenv('ZEROLAB_KEY_PASSWORD') ?: ''
if (zerolabStorePassword.isEmpty() || zerolabKeyPassword.isEmpty()) {
    throw new GradleException(
            "缺少签名密码：请在 local.properties 或环境变量中配置 " +
                    "ZEROLAB_STORE_PASSWORD / ZEROLAB_KEY_PASSWORD（参考 README 构建说明）")
}

android {
    namespace 'com.zerolab.checkin'
    compileSdk 34

    defaultConfig {
        applicationId "com.zerolab.checkin"
        minSdk 24
        targetSdk 34
        versionCode 132
        versionName "1.4.2"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        zerolab {
            storeFile file("../zerolab.keystore")
            storePassword zerolabStorePassword
            keyAlias "zerolab"
            keyPassword zerolabKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.zerolab
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.zerolab
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding false
        // v1.4.2 优化：导出 JSON 的 appVersion 需要读取 BuildConfig.VERSION_NAME
        buildConfig true
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.version']
        }
    }
}

dependencies {
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
}
